name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            demo-api/go.sum

      - name: Verify root module
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...

      - name: Verify demo module
        working-directory: demo-api
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan demo module
        working-directory: demo-api
        run: govulncheck ./...
