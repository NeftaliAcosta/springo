server:
  port: ${PORT:8080}
  api:
    base-path: "/api/v1"
  name: "SprinGo (Default Profile)"
  cors:
    allowed-origins: ["http://localhost:3000", "http://localhost:4200"]
    allowed-origin-patterns: ["https://*.youbootcamps.com"]
    allowed-methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed-headers: ["Authorization", "Content-Type", "X-Requested-With"]
    exposed-headers: ["Content-Disposition"]
    allow-credentials: true
    max-age: 3600

management:
  health:
    show-system: true
    show-components: true
    diskspace:
      enabled: false
      path: "."
      threshold: "100MB"

security:
  jwt:
    secret: "${JWT_SECRET:springo-ultra-secret-key-for-development}"
    expiration: 3600
    public-paths:
      - "/api/v1/auth/login"
      - "/api/v1/actuator/health"
      - "/api/v1/actuator/info"
      - "/swagger"

spring:
  security:
    user:
      name: "admin"
  event:
    enabled: false
    dlq:
      enabled: true
      max-retries: 5
      retry-intervals: ["10s", "30s", "1m", "5m", "10m"]
      store: "main-db"

  datasource:
    driver: "${DB_DRIVER:sqlite}"
    url: "${DATABASE_URL:springo.db}"
    auto-migrate: true
    health-check: true
    migration-table: "springo_migrations"
    migration-lock-timeout: 5m

  scheduler:
    enabled: true
    jobs:
      DLQRetryJob:
        fixed-rate: "10s"
        enabled: true
      AuthTokenJob:
        cron: "0 0 */4 * * *"
        run-on-startup: true
        priority: 1
        critical: true
        enabled: true
      CleanupOldSessionsJob:
        fixed-rate: "10s"
        run-on-startup: true
        priority: 2
        enabled: true
